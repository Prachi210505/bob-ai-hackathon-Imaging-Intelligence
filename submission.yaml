submission:
  title: "TrialGuard"                  # REQUIRED

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Clinical trial risk managers need to find missed visits, incorrect doses,
    prohibited medications, and incomplete assessments before they compromise
    subject safety or delay regulatory submission.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    TrialGuard imports local trial records into SQLite, compares them with
    explicit protocol rules, classifies evidence-backed deviations, ranks site
    risk, and persists CAPA-ready corrective and preventive actions.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Protocol comparison for visits, doses, medications, assessments, and data-entry timing"
    - "Evidence-backed major, minor, and administrative deviation detection"
    - "Explainable site risk ranking from severity-weighted findings"
    - "Local JSON import and SQLite persistence"
    - "CAPA report generation linked to source deviations"

  tech_stack:
    languages: ["Python", "JavaScript", "HTML", "CSS"]
    frameworks: ["FastAPI", "Uvicorn"]
    ibm_technologies: ["IBM Bob adapter boundary"]
    databases: ["SQLite"]
    other: ["GitHub Actions", "JSON import"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The traceable path from imported record to protocol rule, severity,
    explainable site score, and persisted CAPA action.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Authentication and authorization are not enabled yet. IBM Bob credentials
    and the organizer-provided assistant contract still need configuration.

